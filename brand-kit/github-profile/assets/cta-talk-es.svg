<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 159 44" width="159" height="44" role="img" aria-label="Hablemos"><style>
  .stitch{stroke-dasharray:8 6}
  .tw{animation:tw 2.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
  .flo{animation:flo 4s ease-in-out infinite}@keyframes flo{50%{transform:translateY(-6px)}}
  .draw{}
  .av-eyes{transform-origin:100px 105px;animation:blink 5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .av-sparkle{animation:tw 1.6s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
      <defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#B79CFF"/><stop offset="1" stop-color="#FF5C9A"/></linearGradient></defs>
      <rect x="1" y="1" width="157" height="42" rx="21" fill="#2A1D48" stroke="#C9B8FF" stroke-opacity=".5"/>
      <rect x="5" y="5" width="149" height="34" rx="17" fill="none" stroke="#C9B8FF" stroke-opacity=".55" stroke-width="1.2" class="stitch"/>
      <circle cx="24" cy="22" r="12" fill="#FF9ACB" fill-opacity="0.9"/><text x="24" y="27" text-anchor="middle" font-size="13">💌</text>
      <text x="44" y="27" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#F3EEFF">Hablemos</text>
    </svg>