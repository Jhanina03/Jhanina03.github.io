# Draws my contribution graph as a pink thread "sewing" through it, in my palette.
name: Stitch the contribution graph
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FF5C9A&color_dots=#F1EAFF,#D9CCFF,#B79CFF,#9A7BF0,#7B5CD6
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF9ACB&color_dots=#1C1530,#3A2E5C,#5A3FB0,#7B5CD6,#B79CFF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
