    });

    g.fillStyle = C.dots;
    for (let y = Math.max(-60, Math.floor(-top / 24) * 24); y < p.len + 60 && top + y < H; y += 24) for (let x = 12; x < stripW; x += 24) g.fillRect(sx + x, top + y, 2, 2);
    // the pattern piece: filled shape with a solid cutting line on both sides
    g.beginPath();
    for (let y = 0; y <= p.len; y += 8) { const X = W / 2 + half(y, p); y ? g.lineTo(X, top + y) : g.moveTo(X, top + y); }
    for (let y = p.len; y >= 0; y -= 8) g.lineTo(W / 2 - half(y, p), top + y);
    g.closePath(); g.fillStyle = C.fill; g.fill(); g.strokeStyle = C.cut; g.lineWidth = 1.5; g.setLineDash([]); g.stroke();
    // grain line arrow
    g.strokeStyle = C.cut; g.beginPath(); g.moveTo(W / 2 - 10, top + 120); g.lineTo(W / 2 - 10, top + p.len - 120); g.stroke();
    g.font = "18px Caveat"; g.fillStyle = C.note; g.textAlign = "center";
    g.fillText(`${T("pattern")}: ${p.name.toLowerCase()}`, W / 2 - 10, top + p.len / 2); g.fillText(T("size"), W / 2 - 10, top + p.len / 2 + 22);

    let started = false;
    for (let y = 0; y <= p.len; y += 6) { const Y = top + y; if (Y < -20 || Y > H + 20) { started = false; continue; } const X = seamX(y, p); started ? g.lineTo(X, Y) : (g.moveTo(X, Y), started = true); }
    g.stroke(); g.restore();

    for (let i = 1; i < stitches.length; i++) {
      const a = stitches[i - 1], b = stitches[i], ay = top + a.y, by = top + b.y; if (by < -10 || ay > H + 10) continue;

    g.fillStyle = C.arm2; roundRect(needleX - 22, ny - 54, 44, 18, 6); g.fill();
    g.fillStyle = "#FFFFFF"; g.font = "700 12px Fraunces"; g.textAlign = "center"; g.fillText("Maison J.", needleX, ny - 80);
    // spool on top of the machine, wound with this piece's "language" thread
    g.fillStyle = "#C7A27A"; g.fillRect(needleX - 13, ny - 136, 26, 4); g.fillRect(needleX - 13, ny - 120, 26, 4);
    g.fillStyle = thread()[1]; g.fillRect(needleX - 10, ny - 132, 20, 12);
    g.fillStyle = D ? "#E9E2FF" : "#3B2A6B"; g.font = "9px Silkscreen"; g.fillText(thread()[0].toUpperCase(), needleX, ny - 142);
    const bob = Math.sin(needleBob) * 5;
    g.strokeStyle = "#9AA0B4"; g.lineWidth = 3; g.beginPath(); g.moveTo(needleX, ny - 36); g.lineTo(needleX, ny + 6 + bob); g.stroke();
    g.fillStyle = "#E4E6EE"; g.fillRect(needleX - 14, ny - 6 + bob * .3, 28, 5);
    g.strokeStyle = "#FF5C9A"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(needleX, ny - 120); g.quadraticCurveTo(needleX + 18, ny - 70, needleX + 1, ny - 30); g.stroke();
    const d = Math.abs(needleX - seamX(scroll + ny, p));
    g.strokeStyle = d < 16 ? "rgba(61,187,138,.8)" : d < 30 ? "rgba(255,214,107,.9)" : "rgba(255,92,154,.8)"; g.lineWidth = 2;

  }
  function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  dressAvatar(); labels(); pick();
  requestAnimationFrame(frame);
})();
